name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit Tests
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install VapourSynth
        shell: bash
        run: scripts/install-vs.sh
      - name: Install Vulkan headers and Lavapipe on Linux
        if: runner.os == 'Linux'
        run: bash scripts/install-vulkan-linux.sh
      - name: Install Vulkan headers and Lavapipe on macOS
        if: runner.os == 'macOS'
        run: |
          brew install vulkan-headers vulkan-loader vulkan-tools
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/rerun-io/lavapipe-build/releases/download/v0.4.0/lavapipe-macos-arm64.tar.gz
          echo "50c14d456e2212736d8a3cf2f2629da4e027b9fb50863604211cc6de048fcb40  lavapipe-macos-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf lavapipe-macos-arm64.tar.gz
          driver="$RUNNER_TEMP/lavapipe-macos-arm64/lvp_icd.aarch64.json"
          test -f "$driver"
          VK_DRIVER_FILES="$driver" vulkaninfo --summary
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install Vulkan SDK and Lavapipe on Windows
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: '1.4.341.0'
          install_lavapipe: true
      - name: Select Lavapipe on Windows
        if: runner.os == 'Windows'
        run: |
          $driver = Get-ChildItem C:\lavapipe -Recurse -Filter lvp_icd.x86_64.json | Select-Object -First 1
          if (-not $driver) { throw 'Lavapipe driver manifest not found' }
          "VK_DRIVER_FILES=$($driver.FullName)" >> $env:GITHUB_ENV
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build --all-features --workspace
      - name: Tests
        run: cargo nextest run --all-features --workspace
        env:
          VAPOURSYNTH_REQUIRE_VULKAN: "1"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install VapourSynth
        run: scripts/install-vs.sh
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo +nightly build --all-features --workspace
      - name: Generate code coverage
        run: cargo +nightly llvm-cov nextest
          --all-features --workspace
          --ignore-filename-regex vapoursynth4-sys/
          --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  sanitizer:
    name: Sanitizers
    runs-on: ubuntu-latest
    # Builds VapourSynth from source, which is far slower than the wheel install
    # the other jobs use.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install Vulkan headers and Lavapipe
        run: bash scripts/install-vulkan-linux.sh
      # Cached separately from the Rust cache: this tree depends only on the
      # build script, not on Cargo.toml or the toolchain, and keying it off those
      # threw the whole C++ build away on every version bump. No restore-keys --
      # a partial match restores a tree built for a different VapourSynth
      # version, which is worse than rebuilding.
      - name: Cache VapourSynth
        uses: actions/cache@v6
        with:
          path: vapoursynth/
          key: vapoursynth-${{ runner.os }}-vulkan-${{ hashFiles('scripts/build-vs.sh') }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Built from source rather than installed from the wheel: ASan only sees
      # into a dependency that was itself instrumented.
      - name: Build VapourSynth with AddressSanitizer
        run: scripts/build-vs.sh
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build --all-features --workspace
      - name: Address Sanitizer
        run:
          cargo +nightly nextest run -Z build-std --target=x86_64-unknown-linux-gnu --all-features
          -p vapoursynth4-sys -p vapoursynth4-rs
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          RUSTDOCFLAGS: "-Z sanitizer=address"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/lsan.supp"
          VAPOURSYNTH_REQUIRE_VULKAN: "1"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup update stable
      - name: Run Clippy with reviewdog
        uses: giraffate/clippy-action@v1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clippy_flags: --all-features --tests -- -D warnings
          reporter: github-check

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable
      - name: Format check
        run: cargo fmt --all -- --check
