[package]
name = "vapoursynth4-rs"
version = "0.5.2"
edition = "2024"
description = "A safe wrapper for VapourSynth and VSScript API version 4"
license = "MPL-2.0"

repository = "https://github.com/inflation/vapoursynth4-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bon = "3.10.1"
thiserror = "2.0.20"
vapoursynth4-sys = { version = "0.4.2", path = "../vapoursynth4-sys" }

[dev-dependencies]
const-str = "1.1.0"
testresult = "0.4.1"

[features]
default = ["vs-42", "vsscript", "vsscript-43"]
link-vs = ["vapoursynth4-sys/link-vs"]
link-vsscript = ["vapoursynth4-sys/link-vsscript"]
vs-41 = ["vapoursynth4-sys/vs-41"]
vs-42 = ["vapoursynth4-sys/vs-42", "vs-41"]
vsscript = ["vapoursynth4-sys/vsscript"]
vsscript-42 = ["vapoursynth4-sys/vsscript-42", "vsscript"]
vsscript-43 = ["vapoursynth4-sys/vsscript-43", "vsscript-42"]
vs-graph = ["vapoursynth4-sys/vs-graph", "vs-42"]


[lints.clippy]
pedantic = "warn"
