[package]
name = "vapoursynth4-rs"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
description = "A safe wrapper for VapourSynth and VSScript API version 4"
license = "MPL-2.0"

repository = "https://github.com/inflation/vapoursynth4-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bon = "3.10.1"
thiserror = "2.0.20"
vapoursynth4-sys = { version = "0.4.1", path = "../vapoursynth4-sys" }

[dev-dependencies]
const-str = "1.1.0"
testresult = "0.4.1"

[features]
default = ["vs-43", "vsscript", "vsscript-44"]
link-vs = ["vapoursynth4-sys/link-vs"]
link-vsscript = ["vapoursynth4-sys/link-vsscript", "vsscript"]
vs-41 = ["vapoursynth4-sys/vs-41"]
vs-42 = ["vapoursynth4-sys/vs-42", "vs-41"]
vs-43 = ["vapoursynth4-sys/vs-43", "vs-42"]
vulkan = ["vapoursynth4-sys/vulkan", "vs-43"]
vsscript = ["vapoursynth4-sys/vsscript"]
vsscript-42 = ["vapoursynth4-sys/vsscript-42", "vsscript"]
vsscript-43 = ["vapoursynth4-sys/vsscript-43", "vsscript-42"]
vsscript-44 = ["vapoursynth4-sys/vsscript-44", "vsscript-43"]
vs-graph = ["vapoursynth4-sys/vs-graph", "vs-43"]


[lints.clippy]
pedantic = "warn"
